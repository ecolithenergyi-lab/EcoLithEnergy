<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | EcoLith Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="customer-auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-badge">E</div>
          <h1>Reset Password</h1>
          <p class="auth-subtitle">Create a new password for your account.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="resetForm" class="form-grid">
          <label>
            New Password
            <input type="password" name="password" placeholder="Enter new password" required />
          </label>
          <button class="btn primary" type="submit">Update Password</button>
        </form>
      </div>
    </div>

    <script src="customer-auth.js"></script>
  </body>
</html>
