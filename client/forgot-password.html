<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | EcoLith Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="customer-auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-badge">E</div>
          <h1>Forgot Password</h1>
          <p class="auth-subtitle">Enter your account email and we will send a secure reset link.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="forgotForm" class="form-grid">
          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <button class="btn primary" type="submit">Send Reset Link</button>
        </form>

        <div class="inline-row" style="margin-top: 18px;">
          <a href="/login">Back to Login</a>
          <a href="/signup">Create Account</a>
        </div>
      </div>
    </div>

    <script src="customer-auth.js"></script>
  </body>
</html>
