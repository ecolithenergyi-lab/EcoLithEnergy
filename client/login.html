<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login | EcoLith Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="customer-auth.css" />
  </head>
  <body data-google-client-id="">
    <div class="auth-shell">
      <div class="auth-card has-close">
        <a class="auth-close" href="/" aria-label="Close and return to homepage" title="Return to homepage">&times;</a>
        <div class="auth-header">
          <div class="brand-badge">E</div>
          <h1>Customer Login</h1>
          <p class="auth-subtitle">Welcome back. Access your EcoLith account, wishlist, cart and profile.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="loginForm" class="form-grid">
          <label>
            Email
            <input type="email" name="email" placeholder="your@email.com" required />
          </label>

          <label>
            Password
            <input type="password" name="password" placeholder="Enter your password" required />
          </label>

          <div class="inline-row">
            <label class="check"><input type="checkbox" name="rememberMe" /> Remember me</label>
            <a href="/forgot-password">Forgot Password?</a>
          </div>

          <div class="auth-actions">
            <button class="btn primary" type="submit">Login</button>
            <div class="separator">or</div>
            <div id="googleSignIn"></div>
          </div>
        </form>

        <div class="inline-row" style="margin-top: 18px;">
          <span>New customer?</span>
          <a href="/signup">Create Account</a>
        </div>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="customer-auth.js"></script>
  </body>
</html>
