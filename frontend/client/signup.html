<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | EcoLith Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/client/customer-auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card has-close">
        <a class="auth-close" href="/" aria-label="Close and return to homepage" title="Return to homepage">&times;</a>
        <div class="auth-header">
          <div class="brand-badge">E</div>
          <h1>Create Account</h1>
          <p class="auth-subtitle">Register as a customer, dealer or distributor and manage your battery orders with ease.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="signupForm" class="form-grid">
          <div class="form-row">
            <label>
              Full Name
              <input type="text" name="name" placeholder="Rakesh Kumar" required />
            </label>
            <label>
              Phone
              <input type="tel" name="phone" placeholder="+91 98765 43210" required />
            </label>
          </div>

          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <input id="signupPassword" type="password" name="password" placeholder="Create a strong password" required />
            <div class="password-meter"><div id="passwordMeter" class="password-meter-bar"></div></div>
          </label>

          <label>
            Confirm Password
            <input type="password" name="confirmPassword" placeholder="Confirm password" required />
          </label>

          <div class="auth-actions">
            <button class="btn primary" type="submit">Create Account</button>
            <div class="separator">or</div>
            <a class="btn secondary google-oauth-link" data-google-oauth="signup" href="#">Sign up with Google</a>
          </div>
        </form>

        <div class="inline-row" style="margin-top: 18px;">
          <span>Already have an account?</span>
          <a href="/login">Login</a>
        </div>
      </div>
    </div>

    <script src="/client/customer-auth.js"></script>
  </body>
</html>
