<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | EcoLith Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/client/customer-auth.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div class="topbar">
        <h1 class="greeting">Hey Customer</h1>
        <div>
          <a href="/dashboard" class="btn secondary" style="margin-right: 10px;">Dashboard</a>
          <button class="btn primary" id="logoutBtn" type="button">Logout</button>
        </div>
      </div>

      <div class="card" style="max-width: 800px; margin-top: 20px;">
        <div id="messageBox" class="message"></div>
        <form id="profileForm" class="profile-form">
          <div class="form-row">
            <label>
              Full Name
              <input type="text" name="name" placeholder="Your full name" required />
            </label>
            <label>
              Phone
              <input type="tel" name="phone" placeholder="Phone number" required />
            </label>
          </div>

          <button class="btn primary" type="submit">Save Profile</button>
        </form>
      </div>
    </div>

    <script src="/client/customer-auth.js"></script>
    <script src="/client/account-pages.js"></script>
  </body>
</html>
